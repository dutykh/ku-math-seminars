# KU Math Seminars - Week Data
# Author: Dr. Denys Dutykh (Khalifa University of Science and Technology, Abu Dhabi, UAE)
#
# Seminar Status Options:
# - confirmed (default): The seminar is confirmed and will take place as scheduled
# - cancelled: The seminar has been cancelled
# - postponed: The seminar has been postponed to a later date
# - tentative: The seminar is tentatively scheduled but not yet confirmed
#
# Week Status Options:
# - open (default): Regular seminar week
# - holiday: University-wide holiday, seminars paused
# - break: Academic break, seminars paused
# - exams: Examination period, seminars paused
# - standby: Between semesters/exams; seminars are temporarily paused
# - cancelled: Entire seminar week cancelled
#
# Semester metadata (optional):
# - semester: Current semester label (e.g., "Fall 2025")
# - nextSemester: Upcoming semester label (e.g., "Spring 2026")
# - resumeDate: Target date for resuming seminars (e.g., "January 19, 2026")
#
# Note: To skip a seminar series entirely for a week, simply omit it from the seminars list

